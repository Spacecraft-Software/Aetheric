[workspace]
members = [
  "crates/aetheric-rms",
  "crates/aetheric-stratum",
  "crates/aetheric-nova",
  "crates/aetheric-penumbra",
  "crates/aetheric-morpheus",
  "crates/aetheric-orion",
  "crates/aetheric-lumen",
  "crates/aetheric-ipc-types",
  "crates/aetheric-single-screw",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha"
authors = ["Mohamed Hammad <Mohamed.Hammad@SpacecraftSoftware.org>"]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Spacecraft-Software/Aetheric"
rust-version = "1.78"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# IPC
capnp = "0.20"
capnpc = "0.20"

# Text / rope
crop = "0.4"
arc-swap = "1.7"
dashmap = "6"

# GPU rendering
wgpu = "0.20"
cosmic-text = "0.12"
glyphon = "0.6"
fontdb = "0.21"

# TTY rendering
crossterm = "0.28"
ratatui = "0.28"

# Parsing
tree-sitter = "0.22"

# Logging / time
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
jiff = "0.1"

# CLI / errors
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# FFI / bridge
libc = "0.2"
cbindgen = "0.27"

# Git (Phase 3+)
git2 = "0.19"

# Dev / test
criterion = "0.5"
proptest = "1"
tempfile = "3"
tokio-test = "0.4"
assert_cmd = "2"
insta = "1"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
